# Build on every push and pull request, then the dev server of both loaders on a fresh world (tools/servertest.sh). The jars and the
# server log are kept as artifacts.
name: Build

on:
  push:
    paths-ignore: ['**.md', 'docs/**', 'licenses/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # java_version from gradle.properties (21 for 1.21.x, 25 for 26.x); org.gradle.java.home points at a JDK on
      # the dev Mac and does not exist here
      - name: Prepare gradle.properties
        id: props
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          v=$(sed -n 's/^java_version=//p' gradle.properties | tr -d '[:space:]')
          if [ -z "$v" ]; then
            case "$(sed -n 's/^minecraft_version=//p' gradle.properties)" in 26*) v=25 ;; *) v=21 ;; esac
          fi
          echo "java=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.props.outputs.java }}

      - uses: gradle/actions/setup-gradle@v4

      # every @SubscribeEvent method of common is on the mod's bus (1.99.3.1.3 lost the world load trigger)
      - name: Event index
        run: python3 -I tools/check_index.py

      - name: Build
        run: chmod +x gradlew && ./gradlew build --console=plain

      # the dev server (tools/servertest.sh) on a fresh world, NeoForge and Fabric: it has to reach "Done" with no crash and
      # pass the structure self-test (port/PortServerTest: the cult temple, the Weaver's sepulcher and the pit are placed),
      # then start again on the same world without placing them a second time
      - name: Dev server starts
        run: |
          fail=0
          for loader in neoforge fabric; do
            RESTART=1 LOADER=$loader sh tools/servertest.sh || fail=1
            for log in build-server-$loader*.log; do mv "$log" "selftest-${log#build-}"; done
            grep -q 'Done (' selftest-server-$loader.log || fail=1
            ! grep -qE 'Minecraft Crash Report|crash report has been saved|Failed to start|Registry loading errors|FAILED TO BIND' selftest-server-$loader*.log || fail=1
          done
          exit $fail

      - name: Upload test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: selftest-*.log
          if-no-files-found: ignore

      - name: Upload jars
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            */build/libs/*.jar
            build/libs/*.jar
          if-no-files-found: ignore
