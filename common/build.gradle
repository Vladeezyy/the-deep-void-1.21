plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    accessTransformers.from(file('accesstransformer.cfg'))
}

// Compile-time stubs of NeoForge types that only appear in NeoForge-only overrides (NeoForge has the real ones, Fabric
// never loads those methods); not packaged
sourceSets {
    stubs
}

repositories {
    maven { url = 'https://maven.fabricmc.net' }
}

dependencies {
    compileOnly sourceSets.stubs.output
    // Fabric Loader's @Environment next to NeoForge's @OnlyIn (class-retention annotations, nothing at runtime)
    compileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
    // mixins live in common, both loaders ship Mixin at runtime
    compileOnly 'net.fabricmc:sponge-mixin:0.15.4+mixin.0.8.7'
    compileOnly("maven.modrinth:geckolib:${geckolib_version}") { transitive = false } // GeckoLib 26.x: Modrinth only, its classes are the same on both loaders
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

configurations {
    commonStubs {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonStubs(sourceSets.stubs.output.classesDirs.singleFile) { builtBy compileStubsJava }
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources file('src/main/resources')
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xmaxerrs', '100000']
}
