plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_fabric_version}"
    modLocalRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_fabric_version}"
    // JEI needs its config library at runtime (a separate mod on Fabric)
    modLocalRuntime "net.mezzdev.config:mezz_config-${minecraft_version}-fabric:0.6.10"
    // compile-time stubs of NeoForge types in NeoForge-only overrides of the common code (not packaged)
    compileOnly project(path: ':common', configuration: 'commonStubs')
    runtimeOnly project(path: ':common', configuration: 'commonStubs')
}

loom {
    accessWidenerPath = file('src/main/resources/the_deep_void.accesswidener')
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
            runDir('run')
        }
        server {
            server()
            runDir('run')
        }
        // tools/scenetest.sh LOADER=fabric, tools/bench.sh LOADER=fabric
        scene {
            client()
            name 'Scene'
            vmArg "-Ddeepvoid.scene=${project.findProperty('scene') ?: 'true'}"
            runDir('run')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

// The release jar on a production (intermediary-mapped) Fabric server with Fabric API and GeckoLib
configurations {
    productionMods { transitive = false }
}
dependencies {
    productionMods "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    productionMods "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
}
def prodDir = file('run-prod')
tasks.register('prodServer', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    dependsOn remapJar
    mods.from(remapJar.archiveFile)
    mods.from(configurations.productionMods)
    runDir = prodDir
    timeout = java.time.Duration.ofMinutes(5)
    doFirst {
        new File(prodDir, 'world').deleteDir()
        new File(prodDir, 'config').deleteDir()
        prodDir.mkdirs()
        new File(prodDir, 'eula.txt').text = 'eula=true\n'
    }
}

// the NeoForge stubs ship in the Fabric jar: the JVM resolves them when it verifies the NeoForge-only overrides
configurations {
    stubs { transitive = false }
}
dependencies {
    stubs project(path: ':common', configuration: 'commonStubs')
}
tasks.named('jar', Jar) {
    from(configurations.stubs)
}
