modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://www.curseforge.com/minecraft/mc-mods/the-deep-void"
iconFile="logo.png"
enumExtensions="META-INF/enumextensions.json"
credits="Created using MCreator. Port to NeoForge ${minecraft_version}: Vladeezyy"
authors="Sombrius"
description='''
The Deep Void adds a new creepy dimension for you to explore with tons of new content centered around a desolate and forgotten Void.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="${geckolib_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

[[mixins]]
config="the_deep_void.mixins.json"

[[mixins]]
config="the_deep_void.neoforge.mixins.json"
